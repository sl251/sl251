name: Sync Public Profile Activity

# 每天定时运行一次（UTC 19:17 / 北京时间 03:17），并允许手动触发
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

# 顶层默认收紧所有权限，仅在更新步骤授予当前仓库写权限
permissions: {}

concurrency:
  group: sync-profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步公开项目动态与遥测头图
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: 仅在输出发生变化时提交
        run: |
          if [ -z "$(git status --porcelain README.md assets profile.json)" ]; then
            echo "公开活动无变化，跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/header-dark.svg assets/header-light.svg profile.json
          git commit -m "chore: sync public profile activity"
          git push
