<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 278" width="960" height="278" role="img" aria-label="sl251 system specification bento grid (dark)">
  <style>
    @keyframes specDotBreathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.42; }
    }
    @keyframes specEdgeGlow {
      0%, 100% { stroke-opacity: 0; }
      50% { stroke-opacity: 0.36; }
    }
    @keyframes specWarnPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.48; }
    }
    .spec-dot { animation: specDotBreathe 3.6s ease-in-out infinite; }
    .spec-edge { animation: specEdgeGlow 4.8s ease-in-out infinite; }
    .spec-warn { animation: specWarnPulse 2.4s ease-in-out infinite; }
    .spec-d0 { animation-delay: 0s; }
    .spec-d1 { animation-delay: -0.8s; }
    .spec-d2 { animation-delay: -1.6s; }
    .spec-d3 { animation-delay: -2.4s; }
    .spec-d4 { animation-delay: -3.2s; }
    .spec-d5 { animation-delay: -4.0s; }
    @media (prefers-reduced-motion: reduce) {
      .spec-dot, .spec-edge, .spec-warn { animation: none; }
      .motion-only { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="spec-card-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f151e"/>
      <stop offset="100%" stop-color="#0b1017"/>
    </linearGradient>
  </defs>
  <g>
    <rect x="1" y="1" width="468" height="84" rx="12" fill="url(#spec-card-dark)" stroke="#242e3e" stroke-width="1"/>
    <rect class="spec-edge spec-d0" x="1" y="1" width="468" height="84" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0"/>
    <circle class="motion-only" cx="22" cy="21" r="3" fill="none" stroke="#34d399" stroke-width="1.3" stroke-opacity="0.7">
      <animate attributeName="r" values="3;9.5" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle class="spec-dot spec-d0" cx="22" cy="21" r="3" fill="#34d399"/>
    <text x="32" y="25" fill="#64748b" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="1.1">RELEASE &amp; ACCESS</text>
    <g class="spec-icon" transform="translate(435, 13)"><circle cx="8" cy="8" r="5" fill="none" stroke="#34d399" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="#34d399"/></g>
    <text x="19" y="50" fill="#f0f6fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="600">Public Preview · Read-Only</text>
    <text x="19" y="71" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">持续滚动更新，核心实例不接受外部 PR</text>
  </g>
  <g>
    <rect x="491" y="1" width="468" height="84" rx="12" fill="url(#spec-card-dark)" stroke="#242e3e" stroke-width="1"/>
    <rect class="spec-edge spec-d1" x="491" y="1" width="468" height="84" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0"/>
    <circle class="spec-dot spec-d1" cx="512" cy="21" r="3" fill="#38bdf8"/>
    <text x="522" y="25" fill="#64748b" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="1.1">HARDWARE TARGET</text>
    <g class="spec-icon" transform="translate(925, 13)"><rect x="3" y="3" width="10" height="10" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5"/><path d="M6 1v2M10 1v2M6 13v2M10 13v2M1 6h2M1 10h2M13 6h2M13 10h2" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round"/></g>
    <text x="509" y="50" fill="#f0f6fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="600">Carbon-Based · Single Node</text>
    <text x="509" y="71" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">单节点部署，不支持集群化或横向扩容</text>
  </g>
  <g>
    <rect x="1" y="97" width="468" height="84" rx="12" fill="url(#spec-card-dark)" stroke="#242e3e" stroke-width="1"/>
    <rect class="spec-edge spec-d2" x="1" y="97" width="468" height="84" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0"/>
    <circle class="spec-dot spec-d2" cx="22" cy="117" r="3" fill="#34d399"/>
    <text x="32" y="121" fill="#64748b" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="1.1">POWER INPUT</text>
    <g class="spec-icon" transform="translate(435, 109)"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8l1-5.5Z" fill="none" stroke="#34d399" stroke-width="1.4" stroke-linejoin="round"/></g>
    <text x="19" y="146" fill="#f0f6fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="600">Carbohydrates · Sleep</text>
    <text x="19" y="167" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">断供期间触发性能降级与状态告警</text>
  </g>
  <g>
    <rect x="491" y="97" width="468" height="84" rx="12" fill="url(#spec-card-dark)" stroke="#242e3e" stroke-width="1"/>
    <rect class="spec-edge spec-d3" x="491" y="97" width="468" height="84" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0"/>
    <circle class="spec-dot spec-d3" cx="512" cy="117" r="3" fill="#38bdf8"/>
    <text x="522" y="121" fill="#64748b" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="1.1">MAINTENANCE WINDOW</text>
    <g class="spec-icon" transform="translate(925, 109)"><path d="M12.5 9.8A5.2 5.2 0 0 1 6.2 3.5a5.3 5.3 0 1 0 6.3 6.3Z" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linejoin="round"/></g>
    <text x="509" y="146" fill="#f0f6fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="600">6–8h / 24h · Offline</text>
    <text x="509" y="167" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">每日离线执行记忆整理与上下文清理</text>
  </g>
  <g>
    <rect x="1" y="193" width="468" height="84" rx="12" fill="url(#spec-card-dark)" stroke="#242e3e" stroke-width="1"/>
    <rect class="spec-edge spec-d4" x="1" y="193" width="468" height="84" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0"/>
    <circle class="spec-dot spec-d4" cx="22" cy="213" r="3" fill="#38bdf8"/>
    <text x="32" y="217" fill="#64748b" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="1.1">CONCURRENCY</text>
    <g class="spec-icon" transform="translate(435, 205)"><path d="M4 3v10M4 8h5a3 3 0 0 0 3-3V3M10 5l2-2 2 2" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="19" y="242" fill="#f0f6fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="600">1 Thread · Preemptive</text>
    <text x="19" y="263" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">严格单线程调度，新想法到达时直接抢占</text>
  </g>
  <g>
    <rect x="491" y="193" width="468" height="84" rx="12" fill="url(#spec-card-dark)" stroke="#242e3e" stroke-width="1"/>
    <rect class="spec-edge spec-d5" x="491" y="193" width="468" height="84" rx="12" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0"/>
    <circle class="spec-dot spec-d5" cx="512" cy="213" r="3" fill="#f59e0b"/>
    <text x="522" y="217" fill="#64748b" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="1.1">ROLLBACK &amp; BACKLOG</text>
    <g class="spec-warn" transform="translate(925, 205)"><path d="M8 2.2L14 13H2L8 2.2Z" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.4v3.2M8 11.4v.4" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/></g>
    <text x="509" y="242" fill="#f0f6fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="600">No Revert · Growing</text>
    <text x="509" y="263" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">历史版本不可回滚，待办持续高于清理速率</text>
  </g>
</svg>
